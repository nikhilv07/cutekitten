<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kitty High Five ✨</title>

  <style>

    :root {
      --cream: #F7EBE8;
      --pink: #FBCBD3;
      --blue: #A1C3E7;
      --lavender: #908DCE;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      background: linear-gradient(
        135deg,
        var(--cream),
        var(--pink)
      );

      font-family: "Trebuchet MS", sans-serif;

      text-align: center;

      position: relative;
    }

    .card {
      width: min(92vw, 560px);

      padding: 28px 22px 24px;

      border-radius: 28px;

      background: rgba(255,255,255,0.35);

      border: 2px solid rgba(144,141,206,0.18);

      box-shadow:
        0 16px 50px rgba(144,141,206,0.12);

      backdrop-filter: blur(8px);
    }

    h1 {
      color: var(--lavender);

      font-size: clamp(2rem, 5vw, 3.1rem);

      margin: 0 0 10px;
    }

    p {
      color: var(--lavender);

      font-size: 1.08rem;

      margin: 0 0 18px;

      line-height: 1.5;
    }

    #kitten {
      width: min(320px, 78vw);
      height: min(320px, 78vw);

      object-fit: cover;

      border-radius: 28px;

      border: 6px solid var(--blue);

      box-shadow:
        0 0 25px rgba(144,141,206,0.22);

      transition:
        transform 0.18s ease,
        filter 0.18s ease;

      margin-top: 8px;

      background: white;
    }

    #kitten.pop {
      transform:
        scale(1.07)
        rotate(-2deg);

      filter: saturate(1.05);
    }

    #button {
      margin-top: 22px;

      padding: 16px 34px;

      border: none;

      border-radius: 999px;

      background: var(--lavender);

      color: white;

      font-size: 1.08rem;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(144,141,206,0.22);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    #button:hover {
      transform: scale(1.04);

      background: #7f7bc4;
    }

    #counter {
      margin-top: 12px;

      color: var(--lavender);

      font-size: 0.98rem;

      font-weight: 700;
    }

    #status {
      margin-top: 10px;

      color: var(--lavender);

      font-size: 1rem;

      font-weight: bold;

      min-height: 1.4em;
    }

    #jumpscare {
      display: none;

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      z-index: 9999;
    }

    .tiny-note {
      margin-top: 10px;

      color: rgba(144,141,206,0.72);

      font-size: 0.88rem;
    }

    .hearts {
      position: fixed;

      font-size: 24px;

      animation:
        floatUp 6s linear infinite;

      opacity: 0.7;

      pointer-events: none;
    }

    @keyframes floatUp {

      from {
        transform: translateY(100vh);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      to {
        transform: translateY(-120px);
        opacity: 0;
      }

    }

  </style>
</head>

<body>

  <div class="card" id="mainCard">

    <h1>🐾 Kitty High Five! 🐾</h1>

    <p>
      Give all the kittens a high five
      to unlock a special surprise ✨
    </p>

    <img
      id="kitten"
      src="kitten1.webp"
      alt="Cute kitten"
    />

    <button id="button">
      High Five Kitty 💖
    </button>

    <div id="counter">
      High fives: 0 / 5
    </div>

    <div id="status">
      The kittens are waiting politely 🐱
    </div>

    <div class="tiny-note">
      Keep tapping until all kittens are happy ✨
    </div>

  </div>

  <img
    id="jumpscare"
    src="scary.jpeg"
    alt="Jumpscare"
  />

  <audio
    id="scream"
    src="scarysong.mp3">
  </audio>

  <audio
    id="calm"
    src="cutesong.mp3"
    loop>
  </audio>

  <script>

    const kittens = [

      "kitten1.webp",
      "kitten2.webp",
      "kitten3.jpeg",
      "kitten4.jpg",
      "kitten5.jpg"

    ];

    const cuteMessages = [

      "This kitten approves 🐾",
      "Maximum cuteness achieved 💖",
      "The kitten is emotionally fulfilled ✨",
      "The kitten trusts you completely 🌸",
      "Last kitten before the surprise 👀"

    ];

    let clicks = 0;

    let startedMusic = false;

    const kittenImg =
      document.getElementById("kitten");

    const button =
      document.getElementById("button");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const calm =
      document.getElementById("calm");

    const scream =
      document.getElementById("scream");

    const jumpscare =
      document.getElementById("jumpscare");

    const mainCard =
      document.getElementById("mainCard");

    calm.volume = 0.35;

    scream.volume = 1.0;

    function popKitten() {

      kittenImg.classList.remove("pop");

      void kittenImg.offsetWidth;

      kittenImg.classList.add("pop");

      setTimeout(() => {

        kittenImg.classList.remove("pop");

      }, 180);

    }

    function enterFullscreenSafely() {

      const el = document.documentElement;

      if (el.requestFullscreen) {

        el.requestFullscreen().catch(() => {});

      } else if (el.webkitRequestFullscreen) {

        el.webkitRequestFullscreen();

      }

    }

    setInterval(() => {

      const heart =
        document.createElement("div");

      heart.className = "hearts";

      heart.innerHTML = "💖";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (20 + Math.random() * 25) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {

        heart.remove();

      }, 6000);

    }, 500);

    button.addEventListener("click", () => {

      if (!startedMusic) {

        calm.play().catch(() => {});

        startedMusic = true;

      }

      clicks++;

      if (clicks <= kittens.length) {

        kittenImg.src =
          kittens[clicks - 1];

        counter.textContent =
          `High fives: ${clicks} / ${kittens.length}`;

        status.textContent =
          cuteMessages[clicks - 1];

        popKitten();

        if (clicks === kittens.length) {

          button.textContent =
            "One more high five...";

        }

        return;

      }

      if (clicks === kittens.length + 1) {

        button.disabled = true;

        button.textContent =
          "Loading surprise...";

        status.textContent =
          "The kittens prepared something for you 👁️";

        calm.pause();

        enterFullscreenSafely();

        setTimeout(() => {

          mainCard.style.display = "none";

          document.body.style.background =
            "black";

          jumpscare.style.display =
            "block";

          scream.currentTime = 0;

          scream.play().catch(() => {});

        }, 150);

      }

    });

  </script>

</body>
</html>
